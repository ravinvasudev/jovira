<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 700"
  preserveAspectRatio="xMidYMid slice"
  role="img"
  aria-label="Illustration of a full-scale Jovira transformation with an entrance arch, photo wall, and multiple styled zones"
>
  <title>Jovira Grand Celebration package styling</title>

  <defs>
    <linearGradient id="gcWash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#10233f" />
      <stop offset="46%" stop-color="#2f5f91" />
      <stop offset="100%" stop-color="#f47292" />
    </linearGradient>

    <radialGradient id="gcGlow" cx="0.5" cy="0.1" r="0.66">
      <stop offset="0%" stop-color="#95c8fa" stop-opacity="0.46" />
      <stop offset="100%" stop-color="#95c8fa" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="gcBloom" cx="0.5" cy="0.9" r="0.6">
      <stop offset="0%" stop-color="#ffdc5c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffdc5c" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="gcPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f6eb" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#f9f6eb" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <rect width="900" height="700" fill="url(#gcWash)" />
  <rect width="900" height="700" fill="url(#gcGlow)" />
  <rect width="900" height="700" fill="url(#gcBloom)" />

  <!-- entrance arch spanning the scene -->
  <path
    d="M110 620V330a340 210 0 0 1 680 0v290"
    fill="none"
    stroke="#f9f6eb"
    stroke-opacity="0.22"
    stroke-width="46"
    stroke-linecap="round"
  />
  <path
    d="M110 620V330a340 210 0 0 1 680 0v290"
    fill="none"
    stroke="#ffdc5c"
    stroke-opacity="0.42"
    stroke-width="3"
  />

  <!-- multi-zone balloon installations -->
  <g>
    <g fill="#f2b7bb" fill-opacity="0.94">
      <circle cx="150" cy="330" r="34" />
      <circle cx="286" cy="200" r="30" />
      <circle cx="614" cy="200" r="30" />
      <circle cx="750" cy="330" r="34" />
    </g>
    <g fill="#95c8fa">
      <circle cx="196" cy="252" r="28" />
      <circle cx="450" cy="146" r="38" />
      <circle cx="704" cy="252" r="28" />
    </g>
    <g fill="#ffdc5c">
      <circle cx="356" cy="164" r="24" />
      <circle cx="544" cy="164" r="24" />
      <circle cx="132" cy="404" r="22" />
      <circle cx="768" cy="404" r="22" />
    </g>
    <g fill="#c7ebf2" fill-opacity="0.9">
      <circle cx="240" cy="222" r="18" />
      <circle cx="660" cy="222" r="18" />
      <circle cx="450" cy="96" r="20" />
    </g>
  </g>

  <!-- styled photo wall -->
  <g transform="translate(330 356)">
    <rect
      width="240"
      height="230"
      rx="86"
      fill="url(#gcPanel)"
      stroke="#f9f6eb"
      stroke-opacity="0.3"
      stroke-width="2"
    />
    <g stroke="#f9f6eb" stroke-opacity="0.3" stroke-width="3" fill="none">
      <path d="M56 92h128" />
      <path d="M74 132h92" />
      <path d="M92 172h56" />
    </g>
    <circle cx="120" cy="48" r="18" fill="#f47292" fill-opacity="0.85" />
  </g>

  <!-- flanking styled zones -->
  <g transform="translate(112 452)">
    <path
      d="M0 68c0-32 40-58 88-58s88 26 88 58-40 58-88 58S0 100 0 68Z"
      fill="url(#gcPanel)"
    />
    <circle cx="88" cy="60" r="22" fill="#ffdc5c" fill-opacity="0.85" />
  </g>

  <g transform="translate(612 452)">
    <path
      d="M0 68c0-32 40-58 88-58s88 26 88 58-40 58-88 58S0 100 0 68Z"
      fill="url(#gcPanel)"
    />
    <circle cx="88" cy="60" r="22" fill="#c7ebf2" fill-opacity="0.85" />
  </g>

  <g fill="none" stroke="#f9f6eb" stroke-opacity="0.3" stroke-width="2.5">
    <path d="M-20 632c170-58 320 32 486-18s272-72 454-10" />
  </g>

  <g fill="#f9f6eb" fill-opacity="0.5">
    <circle cx="92" cy="180" r="6" />
    <circle cx="822" cy="150" r="7" />
    <circle cx="70" cy="600" r="5" />
    <circle cx="836" cy="612" r="6" />
  </g>
</svg>
