<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 700"
  preserveAspectRatio="xMidYMid slice"
  role="img"
  aria-label="Illustration of a modern graduation celebration with statement signage and coordinated balloons"
>
  <title>Classic graduation celebration styling</title>

  <defs>
    <linearGradient id="cgcWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10233f" />
      <stop offset="60%" stop-color="#1b3a63" />
      <stop offset="100%" stop-color="#2f5f91" />
    </linearGradient>

    <radialGradient id="cgcGlow" cx="0.5" cy="0.24" r="0.6">
      <stop offset="0%" stop-color="#ffdc5c" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#ffdc5c" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cgcBoard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f6eb" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f9f6eb" stop-opacity="0.68" />
    </linearGradient>
  </defs>

  <rect width="900" height="700" fill="url(#cgcWash)" />
  <rect width="900" height="700" fill="url(#cgcGlow)" />

  <!-- statement signage board -->
  <g transform="translate(288 236)">
    <rect width="324" height="228" rx="36" fill="url(#cgcBoard)" />
    <rect
      x="16"
      y="16"
      width="292"
      height="196"
      rx="24"
      fill="none"
      stroke="#10233f"
      stroke-opacity="0.35"
      stroke-width="2"
    />
    <g stroke="#10233f" stroke-opacity="0.4" stroke-width="9" stroke-linecap="round">
      <path d="M70 92h184" />
      <path d="M100 130h124" />
    </g>
    <path
      d="M162 158h0"
      stroke="#f3c63c"
      stroke-width="14"
      stroke-linecap="round"
    />
  </g>

  <!-- graduation caps -->
  <g fill="#f9f6eb" fill-opacity="0.9">
    <path d="M150 200l82-34 82 34-82 34z" />
    <path d="M586 168l72-30 72 30-72 30z" />
  </g>
  <g fill="none" stroke="#ffdc5c" stroke-width="4" stroke-linecap="round">
    <path d="M300 208v40" />
    <path d="M716 176v34" />
  </g>

  <!-- coordinated balloons -->
  <g>
    <g fill="#10233f" fill-opacity="0.72">
      <circle cx="196" cy="392" r="42" />
      <circle cx="706" cy="392" r="42" />
    </g>
    <g fill="#ffdc5c">
      <circle cx="252" cy="450" r="30" />
      <circle cx="650" cy="450" r="30" />
      <circle cx="160" cy="320" r="24" />
      <circle cx="742" cy="320" r="24" />
    </g>
    <g fill="#f9f6eb" fill-opacity="0.88">
      <circle cx="150" cy="452" r="26" />
      <circle cx="752" cy="452" r="26" />
      <circle cx="230" cy="330" r="18" />
      <circle cx="672" cy="330" r="18" />
    </g>
  </g>

  <!-- floor line -->
  <g fill="none" stroke="#ffdc5c" stroke-opacity="0.35" stroke-width="3">
    <path d="M-20 560c180-50 320 40 470-10s260-72 470-12" />
  </g>

  <g fill="#f9f6eb" fill-opacity="0.5">
    <circle cx="104" cy="150" r="6" />
    <circle cx="812" cy="196" r="6" />
    <circle cx="128" cy="620" r="5" />
    <circle cx="778" cy="632" r="6" />
  </g>
</svg>
