<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1800 1000"
  preserveAspectRatio="xMidYMid slice"
  role="img"
  aria-label="Illustration of a Jovira balloon arch styled against a soft draped backdrop"
>
  <title>Jovira balloon arch and draped backdrop styling</title>

  <defs>
    <linearGradient id="skyWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1f3a" />
      <stop offset="48%" stop-color="#1b3a63" />
      <stop offset="100%" stop-color="#2f5f91" />
    </linearGradient>

    <radialGradient id="glowSky" cx="0.16" cy="0.14" r="0.6">
      <stop offset="0%" stop-color="#95c8fa" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#95c8fa" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRose" cx="0.84" cy="0.86" r="0.5">
      <stop offset="0%" stop-color="#f47292" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#f47292" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowSun" cx="0.69" cy="0.3" r="0.42">
      <stop offset="0%" stop-color="#ffdc5c" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#ffdc5c" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="floorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdc5c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffdc5c" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="scrim" x1="0" y1="0" x2="0.62" y2="1">
      <stop offset="0%" stop-color="#0d1f3a" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#0d1f3a" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#0d1f3a" stop-opacity="0.66" />
    </linearGradient>

    <radialGradient id="balloonSheen" cx="0.34" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0d1f3a" stop-opacity="0.18" />
    </radialGradient>

    <linearGradient id="photoBlobFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9f6eb" stop-opacity="0.24" />
      <stop offset="58%" stop-color="#95c8fa" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#f47292" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Base wash -->
  <rect width="1800" height="1000" fill="url(#skyWash)" />
  <rect width="1800" height="1000" fill="url(#glowSky)" />
  <rect width="1800" height="1000" fill="url(#glowRose)" />
  <rect width="1800" height="1000" fill="url(#glowSun)" />

  <!-- Organic drifting shapes -->
  <g opacity="0.14">
    <path
      d="M-60 660 C 190 540 320 780 545 720 C 750 664 792 848 648 940 C 484 1044 44 1020 -60 900 Z"
      fill="#95c8fa"
    />
    <path d="M1320 -40 C 1520 24 1660 -56 1860 44 L1860 -80 L1280 -80 Z" fill="#c7ebf2" />
  </g>

  <!-- Floor glow beneath the installation -->
  <ellipse cx="1245" cy="990" rx="450" ry="110" fill="url(#floorGlow)" />

  <!-- Floating balloons with ribbons -->
  <g stroke="#f9f6eb" stroke-opacity="0.26" stroke-width="1.6" fill="none">
    <path d="M244 268 C 264 348 224 398 250 480" />

    <path d="M790 370 C 808 448 774 496 796 568" />

    <path d="M128 720 C 144 784 116 820 134 880" />

    <path d="M1574 156 C 1592 236 1560 282 1578 356" />

  </g>
  <g>
    <ellipse cx="244" cy="246" rx="40" ry="48" fill="#95c8fa" />
    <ellipse cx="244" cy="246" rx="40" ry="48" fill="url(#balloonSheen)" />

    <ellipse cx="790" cy="348" rx="32" ry="39" fill="#ffdc5c" />
    <ellipse cx="790" cy="348" rx="32" ry="39" fill="url(#balloonSheen)" />

    <ellipse cx="128" cy="698" rx="26" ry="32" fill="#f47292" />
    <ellipse cx="128" cy="698" rx="26" ry="32" fill="url(#balloonSheen)" />


    <ellipse cx="1574" cy="134" rx="30" ry="37" fill="#f47292" />
    <ellipse cx="1574" cy="134" rx="30" ry="37" fill="url(#balloonSheen)" />

  </g>

  <!-- Confetti -->
  <g opacity="0.7">
    <circle cx="112" cy="150" r="5" fill="#ffdc5c" />
    <circle cx="352" cy="92" r="4" fill="#f2b7bb" />
    <circle cx="524" cy="126" r="6" fill="#c7ebf2" />
    <circle cx="806" cy="90" r="4" fill="#ffdc5c" />
    <circle cx="848" cy="252" r="5" fill="#f47292" />
    <circle cx="72" cy="342" r="4" fill="#95c8fa" />
    <circle cx="566" cy="412" r="5" fill="#ffdc5c" />
    <circle cx="760" cy="498" r="4" fill="#c7ebf2" />
    <circle cx="318" cy="646" r="5" fill="#f2b7bb" />
    <circle cx="688" cy="700" r="4" fill="#ffdc5c" />
    <circle cx="1028" cy="148" r="5" fill="#ffdc5c" />
    <circle cx="1146" cy="242" r="4" fill="#95c8fa" />
    <circle cx="1268" cy="104" r="6" fill="#f2b7bb" />
    <circle cx="1392" cy="328" r="5" fill="#c7ebf2" />
    <circle cx="1512" cy="206" r="4" fill="#ffdc5c" />
    <circle cx="1628" cy="296" r="5" fill="#f47292" />
    <circle cx="1738" cy="188" r="4" fill="#95c8fa" />
    <circle cx="1184" cy="620" r="5" fill="#ffdc5c" />
    <circle cx="1462" cy="704" r="4" fill="#f2b7bb" />
    <circle cx="1674" cy="566" r="5" fill="#c7ebf2" />

    <rect x="462" y="248" width="9" height="9" rx="2" fill="#f2b7bb" transform="rotate(24 466 252)" />
    <rect x="714" y="356" width="8" height="8" rx="2" fill="#95c8fa" transform="rotate(-18 718 360)" />
    <rect x="196" y="760" width="9" height="9" rx="2" fill="#ffdc5c" transform="rotate(36 200 764)" />
    <rect x="836" y="596" width="8" height="8" rx="2" fill="#f47292" transform="rotate(-32 840 600)" />
    <rect x="1088" y="284" width="9" height="9" rx="2" fill="#f2b7bb" transform="rotate(-22 1092 288)" />
    <rect x="1244" y="416" width="8" height="8" rx="2" fill="#95c8fa" transform="rotate(28 1248 420)" />
    <rect x="1428" y="528" width="9" height="9" rx="2" fill="#ffdc5c" transform="rotate(-34 1432 532)" />
    <rect x="1658" y="662" width="8" height="8" rx="2" fill="#f47292" transform="rotate(18 1662 666)" />

  </g>

  <!-- Legibility scrim for overlaid copy -->
  <rect width="1800" height="1000" fill="url(#scrim)" />
</svg>
